<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puppy School HQ</title>
<meta name="description" content="A free family puppy training plan and tick-off chart. 5 minutes, 3 times a day, everyone.">
<meta name="theme-color" content="#4f3ddc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puppy School">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-START-->
<header class="top">
  <div class="wrap">
    <div class="pup" id="badge" aria-hidden="true"></div>
    <div class="hdr-txt">
      <h1 id="pupTitle">Puppy School HQ</h1>
      <p id="pupAge">Family puppy training</p>
    </div>
    <span class="sync" id="sync" data-s="local" role="status">This phone</span>
    <button class="me" id="meChip" type="button" hidden></button>
    <button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="wrap" id="main">
  <section class="panel" id="p-loading" data-tab="loading"><p class="note">Loading…</p></section>
  <section class="panel" id="p-pin" data-tab="pin" hidden></section>
  <section class="panel" id="p-who" data-tab="who" hidden></section>
  <section class="panel" id="p-settings" data-tab="settings" hidden></section>
  <section class="panel" id="p-today" data-tab="today" hidden></section>
  <section class="panel" id="p-skills" data-tab="skills" hidden></section>
  <section class="panel" id="p-pack" data-tab="pack" hidden></section>
  <section class="panel" id="p-help" data-tab="help" hidden></section>
  <section class="panel" id="p-watch" data-tab="watch" hidden></section>
</main>

<nav class="tabs" id="tabs" aria-label="Sections" hidden>
  <div class="in" role="tablist">
    <button role="tab" data-go="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 13l3 3 5-6"/></svg>Today</button>
    <button role="tab" data-go="skills" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="2"/><circle cx="12" cy="5.5" r="2"/><circle cx="17" cy="8" r="2"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5c0 2-2 2.5-4 2.5S8 19 8 17z"/></svg>Skills</button>
    <button role="tab" data-go="pack" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.3 6.7 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>Pack</button>
    <button role="tab" class="helpbtn" data-go="help" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>Help!</button>
    <button role="tab" data-go="watch" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Watch</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!--APP-END-->
<script src="content.js"></script>
<script src="rewards.js"></script>
<script src="app.js"></script>
</body>
</html>
