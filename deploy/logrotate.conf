# Rotation for the slot logs on clawdia, where each user unit appends stdout to ~/logs/puppy-training/<slot>.log
# (StandardOutput=append:). The login lines carry phone addresses, so the logs are not kept for long and the copies
# are owner-only. copytruncate keeps the open file handle systemd holds, so no unit restarts.
#
# Install (as the user that runs the units, no root):
#   mkdir -p ~/.config/puppy-training && cp deploy/logrotate.conf ~/.config/puppy-training/logrotate.conf
#   chmod 600 ~/logs/puppy-training/*.log
#   cp deploy/puppy-training-logrotate.service deploy/puppy-training-logrotate.timer ~/.config/systemd/user/
#   systemctl --user daemon-reload && systemctl --user enable --now puppy-training-logrotate.timer
# Dry run:  logrotate -d -s ~/.local/state/puppy-training-logrotate.state ~/.config/puppy-training/logrotate.conf
/home/timt/logs/puppy-training/app.log
/home/timt/logs/puppy-training/prod.log
/home/timt/logs/puppy-training/demo.log
/home/timt/logs/puppy-training/tunnel.log
/home/timt/logs/puppy-training/backup.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    sharedscripts
    postrotate
        chmod 600 /home/timt/logs/puppy-training/*.log* 2>/dev/null || true
    endscript
}
